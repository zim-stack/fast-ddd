# https://git-scm.com/docs/githooks
# This hook is invoked by git-commit and git-merge,
commit-msg:
  follow: true
  commands:
    format:
      glob: "*.py"
      run: uv run black {staged_files}
      stage_fixed: true # re-stage fixes
    lint:
      glob: "*.py"
      run: uv run ruff check --extend-select W --fix {staged_files}
      stage_fixed: true
    pyrefly:
      run: uv run pyrefly check
    mypy:
      run: uv run mypy
