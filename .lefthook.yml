# https://git-scm.com/docs/githooks
glob_matcher: doublestar

# This hook is invoked by git-commit and git-merge,
commit-msg:
  follow: true
  commands:
    format:
      glob: "**/*.py"
      run: uv run black {staged_files}
      stage_fixed: true # re-stage fixes
    lint:
      glob: "**/*.py"
      run: uv run ruff check --extend-select W --fix {staged_files}
      stage_fixed: true
    pyrefly:
      glob: "**/*.py"
      run: uv run pyrefly check {staged_files}
    mypy:
      glob: "**/persistence/**/*.py"
      run: uv run mypy {staged_files}
#    tach: # Todo uncomment when have modules defined
#      run: |
#        uv run tach check
#        uv run make tach.show


pre-push:
  follow: true
  piped: true
  commands:
    test-unit:
      run: |
        time uv run pytest -x -n auto -q --tb=short -W error tests/unit
