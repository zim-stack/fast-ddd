[project]
name = "fast-ddd"
version = "0.1.0"
description = "Domain-driven design building blocks for FastAPI services"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vadzim" },
]
maintainers = [
    { name = "Vadzim" },
]
keywords = ["fastapi", "ddd", "domain-driven-design", "aggregate", "repository", "unit-of-work"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fast_ddd"]

[dependency-groups]
docs = [
    "griffe-typingdoc>=0.3.2",
    "mkdocs>=1.6.1",
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "mkdocs-drawio>=1.16.3",
    "mkdocs-macros-plugin>=1.5.0",
    "mkdocs-material>=9.8.1",
    "mkdocstrings[python]>=1.0.8",
]

[project.urls]
Homepage = "https://github.com/zim-stack/fast-ddd"
Repository = "https://github.com/zim-stack/fast-ddd"
Issues = "https://github.com/zim-stack/fast-ddd/issues"
Documentation = "https://github.com/zim-stack/fast-ddd#readme"
Changelog = "https://github.com/zim-stack/fast-ddd/blob/main/CHANGELOG.md"
