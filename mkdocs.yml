# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: fast-ddd Docs
site_url: https://zim-stack.github.io/fast-ddd/
repo_url: https://github.com/zim-stack/fast-ddd
repo_name: zim-stack/fast-ddd

plugins:
  - search
  - awesome-pages
  - macros:
      module_name: docs/_macros/main
  - drawio:
      darkmode: true
      edit: false
  # https://mkdocstrings.github.io/python/usage/
  - mkdocstrings:
      handlers:
        python:
          paths: [ ./src ]
          options:
            docstring_style: sphinx
            docstring_section_style: spacy
            show_source: false
            show_root_heading: false # module name visibility
            show_root_full_path: false
            merge_init_into_class: false
            members_order: source
            group_by_category: true
            show_signature: true
            show_signature_annotations: true
            extensions:
              - griffe_typingdoc

theme:
  name: material
  features:
    - content.code.copy

extra:
  project_name: fast-ddd
  import_name: fast_ddd

extra_javascript:
  - https://viewer.diagrams.net/js/viewer-static.min.js
  - _javascripts/drawio-reload.js

exclude_docs: |
  _macros/
  _javascripts/
