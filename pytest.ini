[pytest]
env =
    ENV=test

asyncio_mode = auto
;with matching session loops the session scoped fixture event_loop is not needed
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

testpaths = tests

; add directories into `sys.path`
pythonpath = src tests scripts

addopts =
    --strict-markers
    --strict-config
    -ra
    --tb=auto
    ; disable heavy plugins that make test runs slow
    -p no:tach
    ; prevent two test files with the same name in different folders from silently shadowing each other during import
    ; --import-mode=importlib


markers =
    only: mark test as only to be run


log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
